<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>SignalDeck — Banner 01-X · Gold Normalize</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1500px; height: 750px; overflow: hidden; background: #09090b; }
body { position: relative; }
.band-top { position: absolute; top: 0; left: 0; right: 0; height: 125px; background: linear-gradient(to bottom, rgba(245,158,11,0.12) 0%, rgba(59,130,246,0.04) 55%, transparent 100%); }
.band-bottom { position: absolute; bottom: 0; left: 0; right: 0; height: 123px; background: linear-gradient(105deg, #3b82f6 0%, #6366f1 45%, #a855f7 100%); }
.stage { position: absolute; top: 125px; left: 0; width: 1500px; height: 500px; overflow: hidden; }
</style>
</head>
<body>

  <div class="band-top"></div>

  <div class="stage">
    <svg id="svg" width="1500" height="500" style="position:absolute;top:0;left:0;"></svg>

    <div style="position:absolute;inset:0;background:linear-gradient(to right,transparent 0%,transparent 52%,rgba(9,9,11,0.5) 68%,rgba(9,9,11,0.97) 84%);pointer-events:none;"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(to bottom,rgba(9,9,11,0.5) 0%,transparent 20%,transparent 80%,rgba(9,9,11,0.5) 100%);pointer-events:none;"></div>

    <div style="position:absolute;top:54px;right:68px;text-align:right;z-index:10;">
      <div style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:#3b82f6;letter-spacing:0.22em;text-transform:uppercase;margin-bottom:14px;">SignalDeck</div>
      <div style="font-size:64px;font-weight:900;letter-spacing:-0.038em;line-height:0.95;color:#fff;margin-bottom:14px;">
        Gold Distorts Your R.<br>
        <span style="background:linear-gradient(95deg,#60a5fa 0%,#a855f7 100%);-webkit-background-clip:text;background-clip:text;color:transparent;">Normalize It.</span>
      </div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:13px;color:#52525b;letter-spacing:0.05em;margin-bottom:7px;">Contract Size &middot; Pip Confusion &middot; Spread &middot; Sessions</div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#3f3f46;letter-spacing:0.04em;">One risk unit &middot; So XAUUSD and EURUSD are comparable</div>
    </div>

    <div style="position:absolute;bottom:26px;right:68px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#27272a;letter-spacing:0.1em;z-index:10;">sgnldk.com</div>
    <div style="position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(to right,#3b82f6,#a855f7);"></div>
  </div>

<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('svg');

  function el(p, t, a) {
    const e = document.createElementNS(NS, t);
    for (const [k, v] of Object.entries(a)) e.setAttribute(k, v);
    p.appendChild(e); return e;
  }

  /* deterministic pseudo-random so the render is reproducible */
  let s = 20260817;
  function rnd() { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; }

  const defs = el(svg, 'defs', {});

  /* gold line: amber gradient */
  const gradGold = el(defs, 'linearGradient', { id: 'gradGold', x1: '0', y1: '0', x2: '1', y2: '0' });
  el(gradGold, 'stop', { offset: '0%',   'stop-color': '#d97706' });
  el(gradGold, 'stop', { offset: '55%',  'stop-color': '#f59e0b' });
  el(gradGold, 'stop', { offset: '100%', 'stop-color': '#fbbf24' });

  /* fx line: blue gradient */
  const gradFx = el(defs, 'linearGradient', { id: 'gradFx', x1: '0', y1: '0', x2: '1', y2: '0' });
  el(gradFx, 'stop', { offset: '0%',   'stop-color': '#3b82f6' });
  el(gradFx, 'stop', { offset: '100%', 'stop-color': '#60a5fa' });

  const glow = el(defs, 'radialGradient', { id: 'glowPulse' });
  el(glow, 'stop', { offset: '0%',   'stop-color': '#2dd4bf', 'stop-opacity': '0.55' });
  el(glow, 'stop', { offset: '100%', 'stop-color': '#2dd4bf', 'stop-opacity': '0' });

  /* faint grid */
  for (let gy = 90; gy <= 430; gy += 68) {
    el(svg, 'line', { x1: 0, y1: gy, x2: 1500, y2: gy, stroke: '#18181b', 'stroke-width': 1 });
  }

  /* ---------------------------------------------------------------
     One underlying sequence of R outcomes, drawn twice on the left at
     each instrument's NATIVE price scale (gold swings hugely, EURUSD
     looks flat - the two are not comparable), then once on the right
     on a single shared R axis, where they land on top of each other.
     --------------------------------------------------------------- */
  const N = 110, x0 = 60, xNorm = 520, xEnd = 960;
  const kSplit = 62;                 /* index at which we cross the divider */
  const xAxis0 = 610;                /* left edge of the shared R axis */

  /* the shared cumulative-R walk */
  const r = [];
  let acc = 0;
  for (let i = 0; i < N; i++) {
    acc += 0.16 + (rnd() - 0.5) * 0.85;
    r.push(acc);
  }

  const xAtLeft  = (i) => x0 + (i / (kSplit - 1)) * (470 - x0);
  const xAtRight = (i) => 630 + ((i - kSplit) / (N - 1 - kSplit)) * (xEnd - 630);

  const path = (p) => p.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');

  /* ---- LEFT: native scales, deliberately incomparable ---- */
  const GOLD_Y = 300, FX_Y = 428;
  const goldRaw = [], fxRaw = [];
  for (let i = 0; i < kSplit; i++) {
    const x = xAtLeft(i);
    goldRaw.push([x, GOLD_Y - r[i] * 14]);   /* $ moves in whole dollars - big amplitude */
    fxRaw.push([x,  FX_Y  - r[i] * 3.0]);    /* 4th-decimal moves - visually flat */
  }

  el(svg, 'path', { d: path(goldRaw), fill: 'none', stroke: 'url(#gradGold)', 'stroke-width': 3, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' });
  el(svg, 'path', { d: path(fxRaw),   fill: 'none', stroke: 'url(#gradFx)',   'stroke-width': 3, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' });

  el(svg, 'text', {
    x: 62, y: 92,
    'font-family': 'JetBrains Mono, monospace', 'font-size': '14', 'font-weight': '700',
    fill: '#fbbf24', 'letter-spacing': '0.09em'
  }).textContent = 'XAUUSD · 2417.80';
  el(svg, 'text', {
    x: 62, y: 110,
    'font-family': 'JetBrains Mono, monospace', 'font-size': '11',
    fill: '#a16207', 'letter-spacing': '0.05em'
  }).textContent = '100 oz / lot · $1.00 move = $100';

  el(svg, 'text', {
    x: 62, y: FX_Y + 34,
    'font-family': 'JetBrains Mono, monospace', 'font-size': '14', 'font-weight': '700',
    fill: '#60a5fa', 'letter-spacing': '0.09em'
  }).textContent = 'EURUSD · 1.08420';
  el(svg, 'text', {
    x: 62, y: FX_Y + 52,
    'font-family': 'JetBrains Mono, monospace', 'font-size': '11',
    fill: '#52525b', 'letter-spacing': '0.05em'
  }).textContent = '100k units / lot · 0.0001 move = $10';

  /* ---- the divider: normalize to R ---- */
  el(svg, 'line', { x1: xNorm, y1: 74, x2: xNorm, y2: 452, stroke: '#f59e0b', 'stroke-width': 1.6, 'stroke-dasharray': '3 4', opacity: 0.85 });
  el(svg, 'text', {
    x: xNorm + 12, y: 88,
    'font-family': 'JetBrains Mono, monospace', 'font-size': '12', 'font-weight': '700',
    fill: '#fbbf24', 'letter-spacing': '0.08em'
  }).textContent = 'NORMALIZE TO R';

  /* ---- RIGHT: one shared R axis ---- */
  const axisY0 = 300, rStep = 52;
  const yOfR = (v) => axisY0 - v * rStep;

  for (let v = 2; v >= -2; v--) {
    const y = yOfR(v);
    el(svg, 'line', {
      x1: xAxis0, y1: y, x2: xEnd + 20, y2: y,
      stroke: v === 0 ? '#3f3f46' : '#1f1f23',
      'stroke-width': v === 0 ? 1.4 : 1
    });
    el(svg, 'text', {
      x: xAxis0 - 10, y: y + 4, 'text-anchor': 'end',
      'font-family': 'JetBrains Mono, monospace', 'font-size': '11', 'font-weight': '700',
      fill: v === 0 ? '#71717a' : '#52525b'
    }).textContent = (v > 0 ? '+' : '') + v + 'R';
  }

  /* both instruments, now on the same axis - they coincide */
  const goldR = [], fxR = [];
  for (let i = kSplit; i < N; i++) {
    const x = xAtRight(i);
    const y = yOfR((r[i] - r[kSplit]) * 0.25);
    goldR.push([x, y]);
    fxR.push([x, y + 3.2]);          /* hairline offset so both remain readable */
  }

  el(svg, 'path', { d: path(fxR),   fill: 'none', stroke: 'url(#gradFx)',   'stroke-width': 3.2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', opacity: 0.95 });
  el(svg, 'path', { d: path(goldR), fill: 'none', stroke: 'url(#gradGold)', 'stroke-width': 2.4, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', 'stroke-dasharray': '7 5' });

  /* connectors: each native-scale line resolving into the shared axis */
  const gEnd = goldRaw[goldRaw.length - 1], fEnd = fxRaw[fxRaw.length - 1], rStart = goldR[0];
  el(svg, 'path', {
    d: 'M' + gEnd[0].toFixed(1) + ' ' + gEnd[1].toFixed(1) +
       ' Q' + (xNorm - 4) + ' ' + gEnd[1].toFixed(1) + ' ' + rStart[0].toFixed(1) + ' ' + rStart[1].toFixed(1),
    fill: 'none', stroke: '#f59e0b', 'stroke-width': 1.5, 'stroke-dasharray': '2 5', opacity: 0.55
  });
  el(svg, 'path', {
    d: 'M' + fEnd[0].toFixed(1) + ' ' + fEnd[1].toFixed(1) +
       ' Q' + (xNorm - 4) + ' ' + fEnd[1].toFixed(1) + ' ' + rStart[0].toFixed(1) + ' ' + (rStart[1] + 3.2).toFixed(1),
    fill: 'none', stroke: '#3b82f6', 'stroke-width': 1.5, 'stroke-dasharray': '2 5', opacity: 0.55
  });

  el(svg, 'text', {
    x: xAxis0, y: 452,
    'font-family': 'JetBrains Mono, monospace', 'font-size': '12', 'font-weight': '700',
    fill: '#52525b', 'letter-spacing': '0.07em'
  }).textContent = 'SAME UNIT · SAME AXIS · COMPARABLE';

  /* teal pulse where the two resolve into one */
  const last = goldR[goldR.length - 1];
  el(svg, 'circle', { cx: last[0], cy: last[1] + 1.6, r: 24, fill: 'url(#glowPulse)' });
  el(svg, 'circle', { cx: last[0], cy: last[1] + 1.6, r: 5.5, fill: 'none', stroke: '#2dd4bf', 'stroke-width': 2 });
})();
</script>
</body>
</html>
