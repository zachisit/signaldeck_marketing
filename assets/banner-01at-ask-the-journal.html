<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>SignalDeck — Banner 01-AT · Ask the Journal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1500px; height: 750px; overflow: hidden; background: #09090b; }
body { position: relative; }
.band-top { position: absolute; top: 0; left: 0; right: 0; height: 125px; background: linear-gradient(to bottom, rgba(168,85,247,0.12) 0%, rgba(59,130,246,0.04) 55%, transparent 100%); }
.band-bottom { position: absolute; bottom: 0; left: 0; right: 0; height: 123px; background: linear-gradient(105deg, #3b82f6 0%, #6366f1 45%, #a855f7 100%); }
.stage { position: absolute; top: 125px; left: 0; width: 1500px; height: 500px; overflow: hidden; }
</style>
</head>
<body>

  <div class="band-top"></div>

  <div class="stage">
    <svg id="svg" width="1500" height="500" style="position:absolute;top:0;left:0;"></svg>

    <div style="position:absolute;inset:0;background:linear-gradient(to right,transparent 0%,transparent 58%,rgba(9,9,11,0.55) 70%,rgba(9,9,11,0.97) 84%);pointer-events:none;"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(to bottom,rgba(9,9,11,0.5) 0%,transparent 20%,transparent 80%,rgba(9,9,11,0.5) 100%);pointer-events:none;"></div>

    <div style="position:absolute;top:54px;right:68px;text-align:right;z-index:10;">
      <div style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:#3b82f6;letter-spacing:0.22em;text-transform:uppercase;margin-bottom:14px;">SignalDeck</div>
      <div style="font-size:70px;font-weight:900;letter-spacing:-0.038em;line-height:0.95;color:#fff;margin-bottom:14px;">
        20<br>Questions,<br>
        <span style="background:linear-gradient(95deg,#60a5fa 0%,#a855f7 100%);-webkit-background-clip:text;background-clip:text;color:transparent;">Answered.</span>
      </div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:13px;color:#52525b;letter-spacing:0.05em;margin-bottom:7px;">AI Trading Journal Prompts</div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#3f3f46;letter-spacing:0.04em;">real tool calls &middot; demo account &middot; real prices</div>
    </div>

    <div style="position:absolute;bottom:26px;right:68px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#27272a;letter-spacing:0.1em;z-index:10;">sgnldk.com</div>
    <div style="position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(to right,#3b82f6,#a855f7);"></div>
  </div>

<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('svg');
  function el(p, t, a, txt) { const e = document.createElementNS(NS, t); for (const [k, v] of Object.entries(a)) e.setAttribute(k, v); if (txt) e.textContent = txt; p.appendChild(e); return e; }
  const mono = { 'font-family': 'JetBrains Mono, monospace' };
  const defs = el(svg, 'defs', {});
  const g = el(defs, 'linearGradient', { id: 'gb', x1: 0, y1: 0, x2: 1, y2: 0 });
  el(g, 'stop', { offset: '0%', 'stop-color': '#3b82f6' }); el(g, 'stop', { offset: '100%', 'stop-color': '#a855f7' });
  // collapsed prompt chips (left column)
  const CHIPS = ['Which strategy is costing me?', 'What is my expectancy by tag?', 'Weekend vs weekday crypto?', 'Biggest holding, % of book?', 'Am I breaking my trim rule?'];
  CHIPS.forEach((t, i) => {
    const y = 40 + i * 78;
    el(svg, 'rect', { x: 60, y, width: 400, height: 50, rx: 25, fill: '#18181b', stroke: '#27272a', 'stroke-width': 1.5 });
    el(svg, 'circle', { cx: 88, cy: y + 25, r: 5, fill: '#3f3f46' });
    el(svg, 'text', { ...mono, x: 106, y: y + 30, 'font-size': 15, fill: '#a1a1aa' }, t);
  });
  // one expanded chip: the weekday question, answered (demo account, 47 stock swing trades)
  const X = 510, Y = 40;
  el(svg, 'rect', { x: X, y: Y, width: 400, height: 410, rx: 18, fill: '#111113', stroke: 'url(#gb)', 'stroke-width': 2 });
  el(svg, 'text', { ...mono, x: X + 26, y: Y + 40, 'font-size': 15, 'font-weight': 700, fill: '#e4e4e7' }, 'Does my entry day matter?');
  el(svg, 'text', { ...mono, x: X + 26, y: Y + 66, 'font-size': 11, fill: '#52525b', 'letter-spacing': '0.08em' }, 'list_trades · 47 closed stock trades');
  const ROWS = [['MON', 4, 0.08], ['TUE', 12, 0.33], ['WED', 9, -0.66], ['THU', 12, 0.50], ['FRI', 10, -0.06]];
  const zx = X + 280, k = 110;   // px per 1R
  el(svg, 'line', { x1: zx, y1: Y + 92, x2: zx, y2: Y + 352, stroke: '#3f3f46', 'stroke-width': 1.5 });
  ROWS.forEach(([d, n, r], i) => {
    const y = Y + 100 + i * 50;
    el(svg, 'text', { ...mono, x: X + 26, y: y + 22, 'font-size': 14, 'font-weight': 700, fill: '#a1a1aa' }, d);
    el(svg, 'text', { ...mono, x: X + 80, y: y + 22, 'font-size': 12, fill: '#52525b' }, 'n=' + n);
    const w = Math.abs(r) * k;
    el(svg, 'rect', { x: r >= 0 ? zx : zx - w, y: y + 6, width: Math.max(w, 3), height: 22, rx: 4, fill: r < -0.3 ? '#f43f5e' : (r >= 0 ? 'url(#gb)' : '#52525b'), opacity: 0.95 });
    el(svg, 'text', { ...mono, x: r >= 0 ? zx + w + 8 : zx - w - 8, y: y + 22, 'text-anchor': r >= 0 ? 'start' : 'end', 'font-size': 13, 'font-weight': 700, fill: r < -0.3 ? '#fb7185' : '#d4d4d8' }, (r >= 0 ? '+' : '') + r.toFixed(2) + 'R');
  });
  el(svg, 'text', { ...mono, x: X + 26, y: Y + 388, 'font-size': 12, fill: '#fbbf24', 'letter-spacing': '0.04em' }, '9 trades: suggestive, not proven');
})();
</script>
</body>
</html>
