<script>

  }
  const path = (f, from, to) => D.slice(from, to).map((r, k) => (k ? 'L' : 'M') + x(from + k).toFixed(1) + ' ' + y(f(r, from + k)).toFixed(1)).join(' ');
  /* entry basis: raw before the split, raw x 4 after it */
  const basis = (r, i) => i >= SPLIT ? r[0] * 4 : r[0];
  el(svg, 'path', { d: path(basis, 0, D.length), fill: 'none', stroke: '#60a5fa', 'stroke-width': 3 });
