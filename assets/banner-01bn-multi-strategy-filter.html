<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>SignalDeck — Banner 01-BN · Multi-Strategy Filter</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1500px; height: 750px; overflow: hidden; background: #09090b; font-family: Inter, sans-serif; }
body { position: relative; }
.band-top { position: absolute; top: 0; left: 0; right: 0; height: 125px; background: linear-gradient(to bottom, rgba(168,85,247,0.12) 0%, rgba(59,130,246,0.04) 55%, transparent 100%); }
.band-bottom { position: absolute; bottom: 0; left: 0; right: 0; height: 123px; background: linear-gradient(105deg, #3b82f6 0%, #6366f1 45%, #a855f7 100%); }
.stage { position: absolute; top: 125px; left: 0; width: 1500px; height: 500px; overflow: hidden; }
</style>
</head>
<body>

  <div class="band-top"></div>

  <div class="stage">
    <svg id="svg" width="1500" height="500" style="position:absolute;top:0;left:0;"></svg>

    <div style="position:absolute;inset:0;background:linear-gradient(to right,transparent 0%,transparent 58%,rgba(9,9,11,0.55) 70%,rgba(9,9,11,0.97) 84%);pointer-events:none;"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(to bottom,rgba(9,9,11,0.5) 0%,transparent 20%,transparent 80%,rgba(9,9,11,0.5) 100%);pointer-events:none;"></div>

    <div style="position:absolute;top:54px;right:68px;text-align:right;z-index:10;">
      <div style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:#3b82f6;letter-spacing:0.22em;text-transform:uppercase;margin-bottom:14px;">SignalDeck &middot; New</div>
      <div style="font-size:70px;font-weight:900;letter-spacing:-0.038em;line-height:0.95;color:#fff;margin-bottom:14px;">
        Filter by<br>Several<br>
        <span style="background:linear-gradient(95deg,#60a5fa 0%,#a855f7 100%);-webkit-background-clip:text;background-clip:text;color:transparent;">Strategies.</span>
      </div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:13px;color:#52525b;letter-spacing:0.05em;margin-bottom:7px;">Advanced trade filter &middot; v1.0.140</div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#3f3f46;letter-spacing:0.04em;">pick any set &middot; see trades from any of them</div>
    </div>

    <div style="position:absolute;bottom:26px;right:68px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#27272a;letter-spacing:0.1em;z-index:10;">sgnldk.com</div>
    <div style="position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(to right,#3b82f6,#a855f7);"></div>
  </div>

<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('svg');
  function el(p, t, a, txt) { const e = document.createElementNS(NS, t); for (const [k, v] of Object.entries(a)) e.setAttribute(k, v); if (txt) e.textContent = txt; p.appendChild(e); return e; }
  const mono = { 'font-family': 'JetBrains Mono, monospace' };
  // Illustrative UI: strategy names and trades are placeholders, not account data.
  const STRATS = [
    ['Breakout', '#3b82f6', true],
    ['Pullback', '#a855f7', true],
    ['Earnings Gap', '#14b8a6', true],
    ['Mean Reversion', '#f59e0b', false],
    ['Swing Momentum', '#ec4899', false],
  ];
  // filter panel
  const PX = 60, PY = 34, PW = 270;
  el(svg, 'rect', { x: PX, y: PY, width: PW, height: 410, rx: 14, fill: '#1a1f2b', stroke: '#3f3f46', 'stroke-width': 1 });
  el(svg, 'text', { ...mono, x: PX + 20, y: PY + 32, 'font-size': 12, 'font-weight': 700, fill: '#e4e4e7', 'letter-spacing': '0.08em' }, 'FILTER · STRATEGY');
  el(svg, 'text', { ...mono, x: PX + 20, y: PY + 54, 'font-size': 10.5, fill: '#71717a' }, '3 selected');
  STRATS.forEach(([n, c, on], i) => {
    const y = PY + 80 + i * 52;
    el(svg, 'rect', { x: PX + 14, y, width: PW - 28, height: 40, rx: 8, fill: on ? c : '#18181b', 'fill-opacity': on ? 0.14 : 1, stroke: on ? c : '#27272a', 'stroke-width': on ? 1.4 : 1 });
    el(svg, 'rect', { x: PX + 28, y: y + 12, width: 16, height: 16, rx: 4, fill: on ? c : 'none', stroke: on ? c : '#52525b', 'stroke-width': 1.5 });
    if (on) el(svg, 'path', { d: `M ${PX + 32} ${y + 20} L ${PX + 35} ${y + 24} L ${PX + 41} ${y + 16}`, fill: 'none', stroke: '#fff', 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    el(svg, 'text', { ...mono, x: PX + 56, y: y + 25, 'font-size': 13, 'font-weight': on ? 700 : 400, fill: on ? '#f4f4f5' : '#71717a' }, n);
  });
  // arrow
  const ay = PY + 205;
  el(svg, 'path', { d: `M ${PX + PW + 8} ${ay} L ${PX + PW + 48} ${ay}`, fill: 'none', stroke: '#6366f1', 'stroke-width': 2.5, 'stroke-dasharray': '6 5' });
  el(svg, 'path', { d: `M ${PX + PW + 42} ${ay - 7} L ${PX + PW + 54} ${ay} L ${PX + PW + 42} ${ay + 7}`, fill: 'none', stroke: '#a855f7', 'stroke-width': 2.5 });
  // trade list
  const CX = 395, CY = 34, W = 520;
  el(svg, 'rect', { x: CX, y: CY, width: W, height: 410, rx: 14, fill: '#1a1f2b', stroke: '#3f3f46', 'stroke-width': 1 });
  el(svg, 'text', { ...mono, x: CX + 22, y: CY + 32, 'font-size': 13, 'font-weight': 700, fill: '#e4e4e7', 'letter-spacing': '0.06em' }, 'TRADES · ANY OF 3 STRATEGIES');
  const trades = [
    ['NVDA', 0, 'LONG'], ['AAPL', 1, 'LONG'], ['META', 2, 'LONG'],
    ['MSFT', 0, 'LONG'], ['AMD', 1, 'SHORT'], ['TSLA', 2, 'LONG'],
  ];
  trades.forEach(([sym, s, side], i) => {
    const y = CY + 60 + i * 56;
    const [n, c] = STRATS[s];
    el(svg, 'line', { x1: CX + 22, y1: y, x2: CX + W - 22, y2: y, stroke: '#27272a', 'stroke-width': 1 });
    el(svg, 'text', { ...mono, x: CX + 22, y: y + 34, 'font-size': 15, 'font-weight': 700, fill: '#f4f4f5' }, sym);
    el(svg, 'text', { ...mono, x: CX + 102, y: y + 34, 'font-size': 11, fill: '#71717a', 'letter-spacing': '0.08em' }, side);
    const tw = n.length * 8.4 + 28;
    el(svg, 'rect', { x: CX + W - 22 - tw, y: y + 15, width: tw, height: 28, rx: 14, fill: c, 'fill-opacity': 0.16, stroke: c, 'stroke-width': 1.2 });
    el(svg, 'circle', { cx: CX + W - 22 - tw + 14, cy: y + 29, r: 3.5, fill: c });
    el(svg, 'text', { ...mono, x: CX + W - 22 - tw + 24, y: y + 33.5, 'font-size': 12, 'font-weight': 700, fill: '#e4e4e7' }, n);
  });
  const defs = el(svg, 'defs', {});
  const g = el(defs, 'linearGradient', { id: 'gb', x1: 0, y1: 0, x2: 1, y2: 0 });
  el(g, 'stop', { offset: '0%', 'stop-color': '#3b82f6' }); el(g, 'stop', { offset: '100%', 'stop-color': '#a855f7' });
})();
</script>
</body>
</html>
