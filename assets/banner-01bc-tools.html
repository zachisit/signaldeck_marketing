<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('svg');
  function el(p, t, a, txt) { const e = document.createElementNS(NS, t); for (const [k, v] of Object.entries(a)) e.setAttribute(k, v); if (txt !== undefined) e.textContent = txt; p.appendChild(e); return e; }
  const mono = { 'font-family': 'JetBrains Mono, monospace' };
  const sans = { 'font-family': 'Inter, sans-serif' };
  const defs = el(svg, 'defs', {});
  const g = el(defs, 'linearGradient', { id: 'gb', x1: 0, y1: 0, x2: 1, y2: 0 });
  el(g, 'stop', { offset: '0%', 'stop-color': '#3b82f6' }); el(g, 'stop', { offset: '100%', 'stop-color': '#a855f7' });
  const C = { card: '#111113', chip: '#18181b', line: '#27272a', dim: '#52525b', mid: '#a1a1aa', hi: '#e4e4e7', red: '#f43f5e', redT: '#fb7185', amber: '#fbbf24', green: '#10b981' };
  function card(x, y, w, h, grad) { el(svg, 'rect', { x, y, width: w, height: h, rx: 18, fill: C.card, stroke: grad ? 'url(#gb)' : C.line, 'stroke-width': grad ? 2 : 1.5 }); }
  function cap(x, y, t, col) { el(svg, 'text', { ...mono, x, y, 'font-size': 11, fill: col || C.dim, 'letter-spacing': '0.1em' }, t); }

  const X = 60, Y = 30, cw = 378, ch = 92, gx = 24, gy = 20;
  const T2 = [['Position Size', 'lots from risk'], ['R-Multiple', 'entry, stop, exit'], ['Expectancy', 'profit per trade'], ['Kelly Criterion', 'optimal fraction'], ['Pip Value', 'per lot'], ['Drawdown Recovery', 'gain to break even'], ['Prop Firm Payout', 'take-home after split'], ['Would I Pass?', 'prop-firm rules check']];
  T2.forEach(([n, s], i) => {
    const x = X + (i % 2) * (cw + gx), y = Y + Math.floor(i / 2) * (ch + gy);
    el(svg, 'rect', { x, y, width: cw, height: ch, rx: 14, fill: i === 7 ? C.card : C.chip, stroke: i === 7 ? 'url(#gb)' : C.line, 'stroke-width': i === 7 ? 2 : 1.5 });
    el(svg, 'rect', { x: x + 20, y: y + 26, width: 40, height: 40, rx: 10, fill: '#1e293b' });
    el(svg, 'text', { ...mono, x: x + 40, y: y + 52, 'text-anchor': 'middle', 'font-size': 16, 'font-weight': 700, fill: '#93c5fd' }, ['%','R','E','K','$','↓','÷','?'][i]);
    el(svg, 'text', { ...sans, x: x + 76, y: y + 44, 'font-size': 19, 'font-weight': 700, fill: C.hi }, n);
    el(svg, 'text', { ...mono, x: x + 76, y: y + 66, 'font-size': 12, fill: C.dim }, s);
  });

})();
