<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('svg');
  function el(p, t, a) { const e = document.createElementNS(NS, t); for (const [k, v] of Object.entries(a)) e.setAttribute(k, v); p.appendChild(e); return e; }
  function txt(p, a, s) { const e = el(p, 'text', a); e.textContent = s; return e; }
  const MONO = 'JetBrains Mono, monospace';
  /* AAPL daily, Jul 17 - Sep 14 2026 (Polygon): [date, o, h, l, c, volume / median of the prior 20 sessions] */
  const D = [["07-17", 331.98, 334.99, 329.0, 333.74, 1.21], ["07-20", 333.5, 333.71, 323.68, 326.59, 1.0], ["07-21", 323.13, 329.6, 322.22, 327.74, 0.78], ["07-22", 327.87, 329.0, 323.34, 325.89, 0.73], ["07-23", 321.73, 323.3, 319.35, 321.66, 0.77], ["07-24", 321.79, 334.37, 321.62, 333.02, 0.92], ["07-27", 334.54, 339.57, 334.02, 336.91, 1.01], ["07-28", 340.03, 342.89, 335.6, 340.08, 1.06], ["07-29", 339.73, 344.57, 337.35, 338.19, 1.15], ["07-30", 333.1, 334.75, 329.59, 333.43, 1.53], ["07-31", 304.81, 310.69, 300, 308.91, 2.71], ["08-03", 309.58, 311.8, 302.56, 303.42, 1.54], ["08-04", 302.73, 310.42, 301.32, 309.38, 1.39], ["08-05", 309.36, 311.71, 305.67, 311, 0.97], ["08-06", 314.34, 316.29, 309.23, 312.41, 0.91], ["08-07", 311.45, 314.81, 310.74, 313.33, 0.68], ["08-10", 306.83, 308.26, 304.61, 308.26, 0.88], ["08-11", 307.75, 309.97, 302.79, 304.91, 0.74], ["08-12", 305.1, 305.66, 300.57, 302.25, 0.82], ["08-13", 304.21, 306, 302.05, 305.26, 0.81], ["08-14", 306, 307.49, 304.3, 305.93, 0.58], ["08-17", 306.21, 307.66, 302.94, 305.59, 0.82], ["08-18", 307.58, 311.49, 305.74, 310.03, 1.17], ["08-19", 310.14, 319.28, 309.6, 316.83, 1.08], ["08-20", 317.45, 320.28, 310.65, 311.3, 0.85], ["08-21", 312.05, 312.38, 307.01, 309.35, 0.97], ["08-24", 311.47, 313.36, 309.97, 310.34, 0.72], ["08-25", 310.79, 313.59, 308.21, 309.9, 0.56], ["08-26", 310.3, 315.43, 308.8, 313.45, 0.75], ["08-27", 310.55, 315.4, 309.4, 314.58, 0.75], ["08-28", 316.85, 322.37, 315.45, 319.7, 0.94], ["08-31", 319.6, 321.24, 312.8, 316.85, 1.01], ["09-01", 316.98, 327.3, 314.73, 325.13, 1.31], ["09-02", 326.87, 328.4, 323.53, 324.96, 0.83], ["09-03", 324.87, 330.81, 324.11, 328.21, 0.94], ["09-04", 328.31, 328.93, 317.86, 319.97, 1.03], ["09-08", 317.1, 320.7, 314.9, 316.22, 0.91], ["09-09", 315.49, 319.15, 309.9, 315.34, 1.71], ["09-10", 316.67, 326.74, 316.51, 326.57, 1.79], ["09-11", 327.45, 336.22, 326.3, 332.27, 1.3], ["09-14", 334.79, 335.5, 331.34, 333.08, 1.0]];
  const X0 = 70, X1 = 560, PT = 50, PB = 300, VT = 330, VB = 430;
  const LO = 296, HI = 348;
  const step = (X1 - X0) / D.length, cw = step * 0.6;
  const x = i => X0 + step * (i + 0.5), y = v => PB - (PB - PT) * (v - LO) / (HI - LO);
  for (const v of [300, 310, 320, 330, 340]) {
    el(svg, 'line', { x1: X0, x2: X1, y1: y(v), y2: y(v), stroke: '#18181b' });
    txt(svg, { x: X0 - 10, y: y(v) + 4, 'text-anchor': 'end', 'font-family': MONO, 'font-size': 11, fill: '#3f3f46' }, v);
  }
  /* the worked example's invalidation line */
  el(svg, 'line', { x1: X0, x2: X1, y1: y(300), y2: y(300), stroke: '#f43f5e', 'stroke-opacity': 0.7, 'stroke-dasharray': '6 5' });
  const vmax = Math.max(...D.map(r => r[5]));
  D.forEach((r, i) => {
    const [d, o, h, l, c, vx] = r, up = c >= o, col = up ? '#10b981' : '#f43f5e';
    el(svg, 'line', { x1: x(i), x2: x(i), y1: y(h), y2: y(l), stroke: col, 'stroke-width': 1.5 });

    const vcol = vx >= 2 ? '#f0b90b' : vx < 0.8 ? '#27272a' : '#52525b';
    const vh = (VB - VT) * vx / vmax;
    el(svg, 'rect', { x: x(i) - cw / 2, y: VB - vh, width: cw, height: vh, fill: vcol });
  });
  const mark = (date, label, row) => {
    const i = D.findIndex(r => r[0] === date), r = D[i];
    el(svg, 'rect', { x: x(i) - cw / 2 - 5, y: y(r[2]) - 6, width: cw + 10, height: VB - y(r[2]) + 10, fill: 'none', stroke: '#f0b90b', 'stroke-width': 2, rx: 3 });
    txt(svg, { x: x(i), y: PT - 18 + row * 16, 'text-anchor': 'middle', 'font-family': MONO, 'font-size': 12, 'font-weight': 700, fill: '#f0b90b' }, label);
  };
  mark('07-31', 'CLIMAX 2.7\u00d7', 0);
  mark('08-25', 'NO SUPPLY 0.56\u00d7', 0);
  mark('09-01', 'DEMAND', 1);

  /* the ledger: four setups, total R, from the demo journal in the article */
  const L = [['NO SUPPLY', 2, 0.41], ['TEST', 0, 0], ['UPTHRUST', 11, -0.99], ['SPRING', 36, -7.20]];
  const LX = 595, LW = 200;
  txt(svg, { x: LX, y: PT + 4, 'font-family': MONO, 'font-size': 12, 'font-weight': 700, fill: '#a1a1aa', 'letter-spacing': '0.08em' }, '49 TRADES \u00b7 TOTAL R \u00b7 DEMO');
  L.forEach(([n, k, r], j) => {
    const yy = PT + 44 + j * 64, w = LW * Math.abs(r) / 7.5, col = r >= 0 ? '#10b981' : '#f43f5e';
    txt(svg, { x: LX, y: yy, 'font-family': MONO, 'font-size': 13, 'font-weight': 700, fill: '#e4e4e7' }, n);
    txt(svg, { x: LX + LW, y: yy, 'text-anchor': 'end', 'font-family': MONO, 'font-size': 12, fill: '#71717a' }, k + (k === 1 ? ' trade' : ' trades'));
    el(svg, 'rect', { x: LX, y: yy + 10, width: w, height: 14, fill: col, 'fill-opacity': 0.85, rx: 2 });
    txt(svg, { x: LX + w + 8, y: yy + 22, 'font-family': MONO, 'font-size': 13, 'font-weight': 700, fill: k ? col : '#71717a' }, k ? (r >= 0 ? '+' : '\u2212') + Math.abs(r).toFixed(1) + 'R' : 'none confirmed');
  });
})();
</script>
