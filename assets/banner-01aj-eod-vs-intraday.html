<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>SignalDeck — Banner 01-AJ · EOD vs Intraday Drawdown</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1500px; height: 750px; overflow: hidden; background: #09090b; }
body { position: relative; }
/* Decorative top band */
.band-top { position: absolute; top: 0; left: 0; right: 0; height: 125px; background: linear-gradient(to bottom, rgba(168,85,247,0.12) 0%, rgba(59,130,246,0.04) 55%, transparent 100%); }
/* Bold accent bar along the bottom */
.band-bottom { position: absolute; bottom: 0; left: 0; right: 0; height: 123px; background: linear-gradient(105deg, #3b82f6 0%, #6366f1 45%, #a855f7 100%); }
/* The 1500x500 design stage, vertically centered */
.stage { position: absolute; top: 125px; left: 0; width: 1500px; height: 500px; overflow: hidden; }
</style>
</head>
<body>

  <div class="band-top"></div>

  <div class="stage">
    <svg id="svg" width="1500" height="500" style="position:absolute;top:0;left:0;"></svg>

    <div style="position:absolute;inset:0;background:linear-gradient(to right,transparent 0%,transparent 52%,rgba(9,9,11,0.5) 68%,rgba(9,9,11,0.97) 84%);pointer-events:none;"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(to bottom,rgba(9,9,11,0.5) 0%,transparent 20%,transparent 80%,rgba(9,9,11,0.5) 100%);pointer-events:none;"></div>

    <div style="position:absolute;top:48px;right:68px;text-align:right;z-index:10;">
      <div style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:#3b82f6;letter-spacing:0.22em;text-transform:uppercase;margin-bottom:14px;">SignalDeck</div>
      <div style="font-size:74px;font-weight:900;letter-spacing:-0.038em;line-height:0.95;color:#fff;margin-bottom:14px;">
        End of Day<br>
        <span style="background:linear-gradient(95deg,#60a5fa 0%,#a855f7 100%);-webkit-background-clip:text;background-clip:text;color:transparent;">vs Intraday.</span>
      </div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:13px;color:#52525b;letter-spacing:0.05em;margin-bottom:7px;">Same Trades · Same Floor · Different Rule</div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#3f3f46;letter-spacing:0.04em;">Take Profit Trader · Test vs PRO · MAE · R-Multiple</div>
    </div>

    <div style="position:absolute;bottom:26px;right:68px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#27272a;letter-spacing:0.1em;z-index:10;">sgnldk.com</div>
    <div style="position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(to right,#3b82f6,#a855f7);"></div>
  </div>

<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('svg');

  function el(p, t, a) {
    const e = document.createElementNS(NS, t);
    for (const [k, v] of Object.entries(a)) e.setAttribute(k, v);
    p.appendChild(e); return e;
  }

  function prng(seed) {
    let s = seed >>> 0;
    return () => {
      s = Math.imul(s ^ (s >>> 16), 0x45d9f3b);
      s = Math.imul(s ^ (s >>> 16), 0x45d9f3b);
      s ^= s >>> 16;
      return (s >>> 0) / 0xffffffff;
    };
  }

  const rng = prng(91744);

  /* 11 sessions x 17 intraday ticks. The intraday path is what PRO measures;
     the session close is all the Test ever looks at. */
  const SESSIONS = 11, PER = 17, N = SESSIONS * PER;
  const equity = [0];
  for (let i = 1; i < N; i++) {
    const intraday = (rng() - 0.5) * 26;          /* noise inside the session */
    const drift = 0.22;                            /* the account grinds, barely */
    equity.push(equity[i - 1] + intraday + drift);
  }

  /* Force three sessions to dig a deep hole intraday and still close green -
     the exact shape the article is about. */
  [2, 5, 8].forEach((s, k) => {
    const base = s * PER;
    const depth = [74, 92, 82][k];
    for (let j = 4; j < 13; j++) {
      const t = (j - 4) / 8;                       /* 0..1 across the dip */
      equity[base + j] -= Math.sin(t * Math.PI) * depth;
    }
  });

  /* Session closes = the last tick of each session */
  const closeIdx = [];
  for (let s = 0; s < SESSIONS; s++) closeIdx.push(s * PER + PER - 1);

  /* The floor: fixed, and set so every CLOSE clears it while three intraday
     troughs punch through. Same number under both rules. */
  const closes = closeIdx.map(i => equity[i]);
  const floor = Math.min(...closes) - 11;

  const minE = Math.min(...equity, floor), maxE = Math.max(...equity);
  const yRange = maxE - minE;
  const toX = i => 30 + (i / (N - 1)) * 850;
  const toY = v => 58 + ((maxE - v) / yRange) * 384;

  const defs = el(svg, 'defs', {});

  /* Breach zone: everything below the floor */
  const bz = el(defs, 'linearGradient', { id: 'bz', x1: '0', y1: '0', x2: '0', y2: '1' });
  el(bz, 'stop', { offset: '0%', 'stop-color': '#f43f5e', 'stop-opacity': '0.20' });
  el(bz, 'stop', { offset: '100%', 'stop-color': '#f43f5e', 'stop-opacity': '0.02' });

  /* Equity fill gradient */
  const eqg = el(defs, 'linearGradient', { id: 'eqg', x1: '0', y1: '0', x2: '0', y2: '1' });
  el(eqg, 'stop', { offset: '0%', 'stop-color': '#3b82f6', 'stop-opacity': '0.20' });
  el(eqg, 'stop', { offset: '100%', 'stop-color': '#3b82f6', 'stop-opacity': '0.0' });

  /* Grid */
  [0.25, 0.5, 0.75].forEach(f => {
    const y = (58 + f * 384).toFixed(1);
    el(svg, 'line', { x1: 0, y1: y, x2: 920, y2: y, stroke: '#27272a', 'stroke-width': 1, 'stroke-dasharray': '4 8', opacity: 0.4 });
  });

  /* Session boundaries */
  for (let s = 1; s < SESSIONS; s++) {
    const x = toX(s * PER - 0.5).toFixed(1);
    el(svg, 'line', { x1: x, y1: 58, x2: x, y2: 442, stroke: '#27272a', 'stroke-width': 1, opacity: 0.55 });
  }

  /* The breach zone below the floor */
  const fy = toY(floor).toFixed(1);
  el(svg, 'rect', { x: 0, y: fy, width: 920, height: (442 - fy).toFixed(1), fill: 'url(#bz)' });

  /* Equity curve fill */
  let eqFill = '';
  equity.forEach((v, i) => { eqFill += (i === 0 ? 'M' : 'L') + toX(i).toFixed(1) + ',' + toY(v).toFixed(1) + ' '; });
  eqFill += `L${toX(N-1).toFixed(1)},500 L${toX(0).toFixed(1)},500 Z`;
  el(svg, 'path', { d: eqFill, fill: 'url(#eqg)', stroke: 'none' });

  /* The floor - one rose line, the number that is identical under both rules */
  el(svg, 'line', { x1: 0, y1: fy, x2: 920, y2: fy, stroke: '#f43f5e', 'stroke-width': 2.5, 'stroke-dasharray': '9 6', opacity: 0.9 });

  /* The intraday path - what a PRO account is measured on, every tick */
  let eqD = '';
  equity.forEach((v, i) => { eqD += (i === 0 ? 'M' : 'L') + toX(i).toFixed(1) + ',' + toY(v).toFixed(1) + ' '; });
  el(svg, 'path', { d: eqD, stroke: '#3b82f6', 'stroke-width': 6, fill: 'none', opacity: 0.10, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
  el(svg, 'path', { d: eqD, stroke: '#60a5fa', 'stroke-width': 2, fill: 'none', opacity: 0.85, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });

  /* The end-of-day line - the only points the Test ever reads */
  let eodD = '';
  closeIdx.forEach((i, k) => { eodD += (k === 0 ? 'M' : 'L') + toX(i).toFixed(1) + ',' + toY(equity[i]).toFixed(1) + ' '; });
  el(svg, 'path', { d: eodD, stroke: '#2dd4bf', 'stroke-width': 2.5, fill: 'none', opacity: 0.95, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
  closeIdx.forEach(i => {
    el(svg, 'circle', { cx: toX(i).toFixed(1), cy: toY(equity[i]).toFixed(1), r: 5, fill: '#09090b', stroke: '#2dd4bf', 'stroke-width': 2.2 });
  });

  /* Mark the intraday troughs that broke the floor while the close did not */
  for (let s = 0; s < SESSIONS; s++) {
    let lo = Infinity, loI = -1;
    for (let j = 0; j < PER; j++) {
      const i = s * PER + j;
      if (equity[i] < lo) { lo = equity[i]; loI = i; }
    }
    if (lo < floor) {
      const x = toX(loI).toFixed(1), y = toY(lo).toFixed(1);
      el(svg, 'line', { x1: x, y1: fy, x2: x, y2: y, stroke: '#f43f5e', 'stroke-width': 1.5, 'stroke-dasharray': '3 3', opacity: 0.8 });
      el(svg, 'circle', { cx: x, cy: y, r: 6.5, fill: '#f43f5e', opacity: 0.22 });
      el(svg, 'circle', { cx: x, cy: y, r: 3.6, fill: '#f43f5e' });
    }
  }
})();
</script>
</body>
</html>
