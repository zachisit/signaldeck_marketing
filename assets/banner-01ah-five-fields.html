<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>SignalDeck — Banner 01-AH · Five Fields</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1500px; height: 750px; overflow: hidden; background: #09090b; }
body { position: relative; }
.band-top { position: absolute; top: 0; left: 0; right: 0; height: 125px; background: linear-gradient(to bottom, rgba(168,85,247,0.12) 0%, rgba(59,130,246,0.04) 55%, transparent 100%); }
.band-bottom { position: absolute; bottom: 0; left: 0; right: 0; height: 123px; background: linear-gradient(105deg, #3b82f6 0%, #6366f1 45%, #a855f7 100%); }
.stage { position: absolute; top: 125px; left: 0; width: 1500px; height: 500px; overflow: hidden; }
</style>
</head>
<body>

  <div class="band-top"></div>

  <div class="stage">
    <svg id="svg" width="1500" height="500" style="position:absolute;top:0;left:0;"></svg>

    <div style="position:absolute;inset:0;background:linear-gradient(to right,transparent 0%,transparent 52%,rgba(9,9,11,0.5) 68%,rgba(9,9,11,0.97) 84%);pointer-events:none;"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(to bottom,rgba(9,9,11,0.5) 0%,transparent 20%,transparent 80%,rgba(9,9,11,0.5) 100%);pointer-events:none;"></div>

    <div style="position:absolute;top:54px;right:68px;text-align:right;z-index:10;">
      <div style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:#3b82f6;letter-spacing:0.22em;text-transform:uppercase;margin-bottom:14px;">SignalDeck</div>
      <div style="font-size:64px;font-weight:900;letter-spacing:-0.038em;line-height:0.95;color:#fff;margin-bottom:14px;">
        Five Fields.<br>
        <span style="background:linear-gradient(95deg,#60a5fa 0%,#a855f7 100%);-webkit-background-clip:text;background-clip:text;color:transparent;">Drop The Rest.</span>
      </div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:13px;color:#52525b;letter-spacing:0.05em;margin-bottom:7px;">Strategy &middot; Planned Risk &middot; Entry/Exit &middot; Result &middot; MAE</div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#3f3f46;letter-spacing:0.04em;">A log for people who do not want to keep a log</div>
    </div>

    <div style="position:absolute;bottom:26px;right:68px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#27272a;letter-spacing:0.1em;z-index:10;">sgnldk.com</div>
    <div style="position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(to right,#3b82f6,#a855f7);"></div>
  </div>

<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('svg');
  function el(p, t, a) {
    const e = document.createElementNS(NS, t);
    for (const [k, v] of Object.entries(a)) e.setAttribute(k, v);
    p.appendChild(e); return e;
  }
  function txt(p, a, s) { const e = el(p, 'text', a); e.textContent = s; return e; }

  /* deterministic PRNG so a re-render is byte-stable */
  let _s = 20260911;
  const rnd = () => { _s = (_s * 1664525 + 1013904223) % 4294967296; return _s / 4294967296; };

  const MONO = 'JetBrains Mono, monospace';

  const defs = el(svg, 'defs', {});
  const gKeep = el(defs, 'linearGradient', { id: 'gKeep', x1: '0', y1: '0', x2: '1', y2: '0' });
  el(gKeep, 'stop', { offset: '0', 'stop-color': '#3b82f6' });
  el(gKeep, 'stop', { offset: '1', 'stop-color': '#a855f7' });
  const gChip = el(defs, 'linearGradient', { id: 'gChip', x1: '0', y1: '0', x2: '1', y2: '0' });
  el(gChip, 'stop', { offset: '0', 'stop-color': 'rgba(59,130,246,0.16)' });
  el(gChip, 'stop', { offset: '1', 'stop-color': 'rgba(168,85,247,0.05)' });

  /* faint grid behind everything */
  for (let i = 0; i <= 6; i++) {
    const y = 78 + i * 62;
    el(svg, 'line', { x1: 60, y1: y, x2: 760, y2: y, stroke: '#141417', 'stroke-width': 1 });
  }

  /* ---- column A: the five fields that are kept -------------------- */
  const KEEP = [
    ['01', 'STRATEGY LABEL',  'at entry, before the outcome'],
    ['02', 'PLANNED RISK',    'intended stop, in money  =  1R'],
    ['03', 'ENTRY / EXIT',    'timestamps  ·  free from an import'],
    ['04', 'REALISED RESULT', 'free from an import'],
    ['05', 'WORST EXCURSION', 'how far it went against you'],
  ];

  const AX = 60, AW = 372, AY = 74, AH = 58, AGAP = 12;

  txt(svg, { x: AX, y: AY - 20, 'font-family': MONO, 'font-size': 13, 'font-weight': 700,
             fill: '#3b82f6', 'letter-spacing': '0.18em' }, 'LOG THESE');

  KEEP.forEach((row, i) => {
    const y = AY + i * (AH + AGAP);
    el(svg, 'rect', { x: AX, y: y, width: AW, height: AH, rx: 9,
                      fill: 'url(#gChip)', stroke: '#27272a', 'stroke-width': 1 });
    el(svg, 'rect', { x: AX, y: y, width: 3.5, height: AH, rx: 2, fill: 'url(#gKeep)' });
    txt(svg, { x: AX + 20, y: y + 25, 'font-family': MONO, 'font-size': 12, 'font-weight': 700,
               fill: '#52525b' }, row[0]);
    txt(svg, { x: AX + 52, y: y + 25, 'font-family': MONO, 'font-size': 17, 'font-weight': 700,
               fill: '#fafafa', 'letter-spacing': '0.02em' }, row[1]);
    txt(svg, { x: AX + 52, y: y + 44, 'font-family': MONO, 'font-size': 12,
               fill: '#52525b' }, row[2]);
  });

  /* ---- column B: everything you are allowed to drop --------------- */
  const DROP = [
    'SCREENSHOT OF THE SETUP',
    'MOOD / EMOTIONAL SCALE',
    'CONFIDENCE RATING 1-10',
    'MARKET CONTEXT PARAGRAPH',
    'CONFLUENCE CHECKLIST',
    'NEWS EVENTS THAT SESSION',
    'HOURS SLEPT',
    'WHAT I LEARNED TODAY',
    'SESSION REVIEW WRITE-UP',
  ];

  const BX = 482, BY = 74, BSTEP = 40;

  txt(svg, { x: BX, y: BY - 20, 'font-family': MONO, 'font-size': 13, 'font-weight': 700,
             fill: '#3f3f46', 'letter-spacing': '0.18em' }, 'DROP THESE');

  DROP.forEach((label, i) => {
    const y = BY + i * BSTEP;
    const fade = Math.max(0.14, 0.62 - i * 0.055);
    const w = 214 + Math.round(rnd() * 34);
    txt(svg, { x: BX, y: y + 22, 'font-family': MONO, 'font-size': 13,
               fill: '#71717a', 'fill-opacity': fade.toFixed(3) }, label);
    el(svg, 'line', { x1: BX - 4, y1: y + 17, x2: BX + w, y2: y + 17,
                      stroke: '#f43f5e', 'stroke-width': 1.5,
                      'stroke-opacity': (fade * 0.85).toFixed(3) });
  });

  /* the cost line */
  txt(svg, { x: AX, y: 468, 'font-family': MONO, 'font-size': 12, fill: '#3f3f46' },
      'TWO OF THE FIVE ARRIVE FROM A BROKER IMPORT  ·  ONE IS COMPUTED FOR YOU  ·  TWO YOU TYPE');
})();
</script>

</body>
</html>
