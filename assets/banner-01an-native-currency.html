<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>SignalDeck — Banner 01-AN · Native Currency</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1500px; height: 750px; overflow: hidden; background: #09090b; }
body { position: relative; }
.band-top { position: absolute; top: 0; left: 0; right: 0; height: 125px; background: linear-gradient(to bottom, rgba(168,85,247,0.12) 0%, rgba(245,158,11,0.04) 55%, transparent 100%); }
.band-bottom { position: absolute; bottom: 0; left: 0; right: 0; height: 123px; background: linear-gradient(105deg, #3b82f6 0%, #6366f1 45%, #a855f7 100%); }
.stage { position: absolute; top: 125px; left: 0; width: 1500px; height: 500px; overflow: hidden; }
</style>
</head>
<body>

  <div class="band-top"></div>

  <div class="stage">
    <svg id="svg" width="1500" height="500" style="position:absolute;top:0;left:0;"></svg>

    <div style="position:absolute;inset:0;background:linear-gradient(to right,transparent 0%,transparent 52%,rgba(9,9,11,0.5) 68%,rgba(9,9,11,0.97) 84%);pointer-events:none;"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(to bottom,rgba(9,9,11,0.5) 0%,transparent 20%,transparent 80%,rgba(9,9,11,0.5) 100%);pointer-events:none;"></div>

    <div style="position:absolute;top:54px;right:68px;text-align:right;z-index:10;">
      <div style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:#3b82f6;letter-spacing:0.22em;text-transform:uppercase;margin-bottom:14px;">SignalDeck</div>
      <div style="font-size:64px;font-weight:900;letter-spacing:-0.038em;line-height:0.95;color:#fff;margin-bottom:14px;">
        Every Trade<br>in Its Own<br>
        <span style="background:linear-gradient(95deg,#60a5fa 0%,#a855f7 100%);-webkit-background-clip:text;background-clip:text;color:transparent;">Currency.</span>
      </div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:13px;color:#52525b;letter-spacing:0.05em;margin-bottom:7px;">Tokyo &middot; London &middot; Toronto &middot; Sydney &middot; Frankfurt</div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#3f3f46;letter-spacing:0.04em;">International stocks &middot; Native P&amp;L &middot; USD at the exit-date rate</div>
    </div>

    <div style="position:absolute;bottom:26px;right:68px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#27272a;letter-spacing:0.1em;z-index:10;">sgnldk.com</div>
    <div style="position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(to right,#3b82f6,#a855f7);"></div>
  </div>

<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('svg');
  function el(p, t, a) {
    const e = document.createElementNS(NS, t);
    for (const [k, v] of Object.entries(a)) e.setAttribute(k, v);
    p.appendChild(e); return e;
  }
  function txt(x, y, s, size, fill, extra) {
    const t = el(svg, 'text', Object.assign({ x: x, y: y, 'font-family': 'JetBrains Mono, monospace',
      'font-size': String(size), fill: fill, 'letter-spacing': '0.06em' }, extra || {}));
    t.textContent = s; return t;
  }

  for (let gy = 90; gy <= 430; gy += 68) {
    el(svg, 'line', { x1: 0, y1: gy, x2: 1500, y2: gy, stroke: '#18181b', 'stroke-width': 1 });
  }

  /* Four illustrative closed trades, each kept in its own currency, then
     valued in USD at the rate on its exit date. Fifth lane: the failure. */
  const lanes = [
    { v: 'TYO', s: '7203',  pl: '+¥28,000', r: '+2.0R', usd: '≈ +$186.67', c: '#2dd4bf' },
    { v: 'LSE', s: 'MYI',   pl: '+£412.50', r: '+1.5R', usd: '≈ +$536.25', c: '#2dd4bf' },
    { v: 'ASX', s: 'NWH',   pl: '-A$310.00',     r: '-1.0R', usd: '≈ -$204.60', c: '#2dd4bf' },
    { v: 'XETRA', s: 'SAP', pl: '+€960.00', r: '+3.0R', usd: '≈ +$1,123.20', c: '#2dd4bf' },
  ];
  const x0 = 56, xDiv = 470, xUsd = 492;
  txt(x0, 70, 'NATIVE P&L', 13, '#a1a1aa', { 'font-weight': '700', 'letter-spacing': '0.09em' });
  txt(xUsd, 70, 'USD', 13, '#a1a1aa', { 'font-weight': '700', 'letter-spacing': '0.09em' });

  lanes.forEach((L, i) => {
    const y = 112 + i * 64;
    el(svg, 'rect', { x: x0, y: y - 20, width: 64, height: 28, rx: 5, fill: '#18181b', stroke: '#3b82f6', 'stroke-opacity': 0.5 });
    txt(x0 + 32, y - 1, L.v, 11, '#60a5fa', { 'text-anchor': 'middle', 'font-weight': '700', 'letter-spacing': '0.04em' });
    txt(x0 + 78, y - 1, L.s, 13, '#e4e4e7', { 'font-weight': '700' });
    txt(x0 + 158, y - 1, L.pl, 15, L.pl[0] === '-' ? '#fb7185' : '#34d399', { 'font-weight': '700', 'letter-spacing': '0.02em' });
    txt(x0 + 300, y - 1, L.r, 13, '#a1a1aa', { 'font-weight': '700' });
    el(svg, 'line', { x1: x0 + 362, y1: y - 6, x2: xDiv - 6, y2: y - 6, stroke: L.c, 'stroke-width': 1.6, opacity: 0.8 });
    el(svg, 'circle', { cx: xDiv, cy: y - 6, r: 3.5, fill: '#f59e0b' });
    txt(xUsd, y - 1, L.usd, 14, '#d4d4d8', { 'font-weight': '700', 'letter-spacing': '0.02em' });
  });

  /* the failure lane */
  const yf = 112 + 4 * 64 + 6;
  txt(x0, yf - 1, '¥28,000 logged as $28,000', 13, '#fb7185', { 'font-weight': '700', 'letter-spacing': '0.03em', 'text-decoration': 'line-through' });
  el(svg, 'line', { x1: x0 + 290, y1: yf - 6, x2: xDiv - 6, y2: yf - 6, stroke: '#fb7185', 'stroke-width': 1.6, 'stroke-dasharray': '2 5', opacity: 0.8 });
  const cx = xUsd + 8, cy = yf - 6;
  el(svg, 'line', { x1: cx - 6, y1: cy - 6, x2: cx + 6, y2: cy + 6, stroke: '#fb7185', 'stroke-width': 2.2 });
  el(svg, 'line', { x1: cx + 6, y1: cy - 6, x2: cx - 6, y2: cy + 6, stroke: '#fb7185', 'stroke-width': 2.2 });
  txt(xUsd + 24, yf - 1, '150x too big', 12, '#fb7185', { 'font-weight': '700' });

  /* exit-date divider */
  el(svg, 'line', { x1: xDiv, y1: 52, x2: xDiv, y2: 452, stroke: '#f59e0b', 'stroke-width': 1.6, 'stroke-dasharray': '3 4', opacity: 0.85 });
  txt(xDiv - 8, 470, 'RATE ON THE EXIT DATE', 11, '#fbbf24', { 'font-weight': '700', 'text-anchor': 'middle', 'letter-spacing': '0.08em' });
})();
</script>
</body>
</html>
