<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>SignalDeck — Banner 01-BJ · Retro-Tag</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1500px; height: 750px; overflow: hidden; background: #09090b; }
body { position: relative; }
.band-top { position: absolute; top: 0; left: 0; right: 0; height: 125px; background: linear-gradient(to bottom, rgba(168,85,247,0.12) 0%, rgba(59,130,246,0.04) 55%, transparent 100%); }
.band-bottom { position: absolute; bottom: 0; left: 0; right: 0; height: 123px; background: linear-gradient(105deg, #3b82f6 0%, #6366f1 45%, #a855f7 100%); }
.stage { position: absolute; top: 125px; left: 0; width: 1500px; height: 500px; overflow: hidden; }
</style>
</head>
<body>

  <div class="band-top"></div>

  <div class="stage">
    <svg id="svg" width="1500" height="500" style="position:absolute;top:0;left:0;"></svg>

    <div style="position:absolute;inset:0;background:linear-gradient(to right,transparent 0%,transparent 58%,rgba(9,9,11,0.55) 70%,rgba(9,9,11,0.97) 84%);pointer-events:none;"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(to bottom,rgba(9,9,11,0.5) 0%,transparent 20%,transparent 80%,rgba(9,9,11,0.5) 100%);pointer-events:none;"></div>

    <div style="position:absolute;top:54px;right:68px;text-align:right;z-index:10;">
      <div style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:#3b82f6;letter-spacing:0.22em;text-transform:uppercase;margin-bottom:14px;">SignalDeck</div>
      <div style="font-size:70px;font-weight:900;letter-spacing:-0.038em;line-height:0.95;color:#fff;margin-bottom:14px;">
        Back-Tag<br>a Year of<br>
        <span style="background:linear-gradient(95deg,#60a5fa 0%,#a855f7 100%);-webkit-background-clip:text;background-clip:text;color:transparent;">Trades.</span>
      </div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:13px;color:#52525b;letter-spacing:0.05em;margin-bottom:7px;">Retro-Tagging With an AI Assistant</div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#3f3f46;letter-spacing:0.04em;">real tool calls &middot; demo account &middot; real prices</div>
    </div>

    <div style="position:absolute;bottom:26px;right:68px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#27272a;letter-spacing:0.1em;z-index:10;">sgnldk.com</div>
    <div style="position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(to right,#3b82f6,#a855f7);"></div>
  </div>

<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('svg');
  function el(p, t, a, txt) { const e = document.createElementNS(NS, t); for (const [k, v] of Object.entries(a)) e.setAttribute(k, v); if (txt) e.textContent = txt; p.appendChild(e); return e; }
  const mono = { 'font-family': 'JetBrains Mono, monospace' };
  const defs = el(svg, 'defs', {});
  const g = el(defs, 'linearGradient', { id: 'gb', x1: 0, y1: 0, x2: 1, y2: 0 });
  el(g, 'stop', { offset: '0%', 'stop-color': '#3b82f6' }); el(g, 'stop', { offset: '100%', 'stop-color': '#a855f7' });
  // Real rows from the B7 demo account (Apr 21 - May 22 2026, before the trader started tagging), with the tags
  // the assistant back-filled. E = Earnings Hold, G = Gap Through Stop.
  const ROWS = [['APR 21', 'AMD', 2.00, ''], ['APR 23', 'NFLX', -1.00, ''], ['APR 24', 'META', -1.24, 'EG'], ['APR 28', 'XOM', -1.00, 'E'],
                ['APR 29', 'NFLX', -1.03, 'G'], ['MAY 01', 'COST', 0.51, ''], ['MAY 14', 'NFLX', -0.29, ''], ['MAY 22', 'GOOGL', -1.07, 'G']];
  const X = 60, Y = 26, RH = 50;
  el(svg, 'text', { ...mono, x: X, y: Y + 6, 'font-size': 11, fill: '#52525b', 'letter-spacing': '0.12em' }, 'CLOSED TRADES · 2026 · NO TAGS UNTIL JUNE');
  ROWS.forEach(([d, sym, r, tags], i) => {
    const y = Y + 22 + i * RH;
    const hit = tags.length > 0;
    el(svg, 'rect', { x: X, y, width: 800, height: RH - 10, rx: 8, fill: hit ? '#141418' : '#0f0f12', stroke: hit ? '#3f3f46' : '#1f1f23', 'stroke-width': 1 });
    el(svg, 'text', { ...mono, x: X + 18, y: y + 26, 'font-size': 13, fill: '#71717a' }, d);
    el(svg, 'text', { ...mono, x: X + 104, y: y + 26, 'font-size': 14, 'font-weight': 700, fill: '#d4d4d8' }, sym);
    el(svg, 'text', { ...mono, x: X + 262, y: y + 26, 'text-anchor': 'end', 'font-size': 14, 'font-weight': 700, fill: r < 0 ? (r < -1.01 ? '#fb7185' : '#a1a1aa') : '#34d399' }, (r >= 0 ? '+' : '') + r.toFixed(2) + 'R');
    let cx = X + 296;
    for (const c of tags) {
      const [label, col] = c === 'E' ? ['EARNINGS HOLD', '#f97316'] : ['GAP THROUGH STOP', '#14b8a6'];
      const w = label.length * 8.4 + 26;
      el(svg, 'rect', { x: cx, y: y + 8, width: w, height: 24, rx: 12, fill: col, 'fill-opacity': 0.16, stroke: col, 'stroke-width': 1.3 });
      el(svg, 'text', { ...mono, x: cx + 13, y: y + 25, 'font-size': 12, 'font-weight': 700, fill: col === '#f97316' ? '#fdba74' : '#5eead4', 'letter-spacing': '0.04em' }, label);
      cx += w + 10;
    }
  });
  // write-budget meter: 19 writes used of production's 120-per-hour budget (2 create_tag + 17 set_trade_tags)
  const MY = Y + 22 + ROWS.length * RH + 6;
  el(svg, 'text', { ...mono, x: X, y: MY + 14, 'font-size': 12, 'font-weight': 700, fill: '#fbbf24', 'letter-spacing': '0.1em' }, 'WRITE BUDGET');
  const BX = X + 128, BW = 420;
  el(svg, 'rect', { x: BX, y: MY, width: BW, height: 18, rx: 9, fill: '#18181b', stroke: '#3f3f46', 'stroke-width': 1 });
  el(svg, 'rect', { x: BX, y: MY, width: BW * 19 / 120, height: 18, rx: 9, fill: '#f59e0b', 'fill-opacity': 0.85 });
  el(svg, 'text', { ...mono, x: BX + BW + 14, y: MY + 14, 'font-size': 13, 'font-weight': 700, fill: '#fbbf24' }, '19 / 120 per hr');
})();
</script>
</body>
</html>
