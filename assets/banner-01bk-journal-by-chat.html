<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>SignalDeck — Banner 01-BK · Journal by Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1500px; height: 750px; overflow: hidden; background: #09090b; }
body { position: relative; }
.band-top { position: absolute; top: 0; left: 0; right: 0; height: 125px; background: linear-gradient(to bottom, rgba(168,85,247,0.12) 0%, rgba(59,130,246,0.04) 55%, transparent 100%); }
.band-bottom { position: absolute; bottom: 0; left: 0; right: 0; height: 123px; background: linear-gradient(105deg, #3b82f6 0%, #6366f1 45%, #a855f7 100%); }
.stage { position: absolute; top: 125px; left: 0; width: 1500px; height: 500px; overflow: hidden; }
</style>
</head>
<body>

  <div class="band-top"></div>

  <div class="stage">
    <svg id="svg" width="1500" height="500" style="position:absolute;top:0;left:0;"></svg>

    <div style="position:absolute;inset:0;background:linear-gradient(to right,transparent 0%,transparent 58%,rgba(9,9,11,0.55) 70%,rgba(9,9,11,0.97) 84%);pointer-events:none;"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(to bottom,rgba(9,9,11,0.5) 0%,transparent 20%,transparent 80%,rgba(9,9,11,0.5) 100%);pointer-events:none;"></div>

    <div style="position:absolute;top:54px;right:68px;text-align:right;z-index:10;">
      <div style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:#3b82f6;letter-spacing:0.22em;text-transform:uppercase;margin-bottom:14px;">SignalDeck</div>
      <div style="font-size:70px;font-weight:900;letter-spacing:-0.038em;line-height:0.95;color:#fff;margin-bottom:14px;">
        Say It.<br>It&rsquo;s<br>
        <span style="background:linear-gradient(95deg,#60a5fa 0%,#a855f7 100%);-webkit-background-clip:text;background-clip:text;color:transparent;">Journaled.</span>
      </div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:13px;color:#52525b;letter-spacing:0.05em;margin-bottom:7px;">Notes &amp; Journal Entries by Chat</div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#3f3f46;letter-spacing:0.04em;">real tool calls &middot; demo account &middot; real prices</div>
    </div>

    <div style="position:absolute;bottom:26px;right:68px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#27272a;letter-spacing:0.1em;z-index:10;">sgnldk.com</div>
    <div style="position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(to right,#3b82f6,#a855f7);"></div>
  </div>

<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('svg');
  function el(p, t, a, txt) { const e = document.createElementNS(NS, t); for (const [k, v] of Object.entries(a)) e.setAttribute(k, v); if (txt) e.textContent = txt; p.appendChild(e); return e; }
  const mono = { 'font-family': 'JetBrains Mono, monospace' };
  const sans = { 'font-family': 'Inter, sans-serif' };
  // Real words from the B6 session (2026-11-09): the dictated message, and the entry + note it was filed as.
  // 1) chat bubble
  const X = 60;
  el(svg, 'text', { ...mono, x: X, y: 34, 'font-size': 11, fill: '#52525b', 'letter-spacing': '0.12em' }, 'YOU, TO THE ASSISTANT');
  el(svg, 'rect', { x: X, y: 46, width: 400, height: 112, rx: 18, fill: '#1e293b', stroke: '#334155', 'stroke-width': 1 });
  ['rough morning. cut NVDA early', 'today, felt rushed. it was green', 'and I didnt want to give it back.'].forEach((t, i) =>
    el(svg, 'text', { ...mono, x: X + 20, y: 82 + i * 26, 'font-size': 15, fill: '#e2e8f0' }, t));
  // 2) arrow with the confirm step
  el(svg, 'path', { d: `M ${X + 410} 102 C ${X + 470} 102, ${X + 450} 210, ${X + 505} 210`, fill: 'none', stroke: 'url(#gb)', 'stroke-width': 2.5, 'stroke-dasharray': '6 6' });
  el(svg, 'path', { d: `M ${X + 497} 203 L ${X + 509} 210 L ${X + 497} 217`, fill: 'none', stroke: '#a855f7', 'stroke-width': 2.5 });
  el(svg, 'rect', { x: X + 330, y: 180, width: 118, height: 26, rx: 13, fill: '#09090b', stroke: '#fbbf24', 'stroke-width': 1.2 });
  el(svg, 'text', { ...mono, x: X + 389, y: 198, 'text-anchor': 'middle', 'font-size': 11, 'font-weight': 700, fill: '#fbbf24', 'letter-spacing': '0.08em' }, 'YOU APPROVE');
  // 3) journal card
  const CX = X + 520, CY = 120;
  el(svg, 'rect', { x: CX, y: CY, width: 420, height: 196, rx: 14, fill: '#1e2433', stroke: '#3f3f46', 'stroke-width': 1 });
  el(svg, 'text', { ...mono, x: CX + 20, y: CY + 32, 'font-size': 13, fill: '#71717a' }, '2026-11-09');
  el(svg, 'rect', { x: CX + 118, y: CY + 15, width: 50, height: 24, rx: 12, fill: '#fb7185', 'fill-opacity': 0.16, stroke: '#fb7185', 'stroke-width': 1.2 });
  el(svg, 'text', { ...mono, x: CX + 143, y: CY + 32, 'text-anchor': 'middle', 'font-size': 12, 'font-weight': 700, fill: '#fda4af' }, 'Bad');
  el(svg, 'text', { ...mono, x: CX + 400, y: CY + 32, 'text-anchor': 'end', 'font-size': 11, fill: '#52525b', 'letter-spacing': '0.1em' }, 'JOURNAL');
  ['Rough morning. Cut NVDA early. It was', 'green and I didn’t want to give it back,', 'and nothing on the chart said get out.', 'Felt rushed the whole time.'].forEach((t, i) =>
    el(svg, 'text', { ...sans, x: CX + 20, y: CY + 68 + i * 26, 'font-size': 16, fill: '#d4d4d8' }, t));
  // 4) trade note chip
  const NY = CY + 214;
  el(svg, 'rect', { x: CX, y: NY, width: 420, height: 44, rx: 10, fill: '#141418', stroke: '#14b8a6', 'stroke-width': 1.2 });
  el(svg, 'text', { ...mono, x: CX + 18, y: NY + 28, 'font-size': 13, 'font-weight': 700, fill: '#5eead4' }, 'NOTE → NVDA · +0.33R · “felt rushed”');
  // 5) the pattern it found
  el(svg, 'text', { ...mono, x: X, y: 420, 'font-size': 12, 'font-weight': 700, fill: '#fbbf24', 'letter-spacing': '0.1em' }, 'EARLY CUTS FOUND');
  [['AUG 4', 'META', '+0.28R'], ['SEP 24', 'MSFT', '+0.14R'], ['NOV 9', 'NVDA', '+0.33R']].forEach(([d, s, r], i) => {
    const x = X + 170 + i * 150;
    el(svg, 'rect', { x, y: 400, width: 136, height: 30, rx: 15, fill: '#f59e0b', 'fill-opacity': 0.12, stroke: '#f59e0b', 'stroke-width': 1 });
    el(svg, 'text', { ...mono, x: x + 68, y: 420, 'text-anchor': 'middle', 'font-size': 12, 'font-weight': 700, fill: '#fcd34d' }, `${d} ${s} ${r}`);
  });
  const defs = el(svg, 'defs', {});
  const g = el(defs, 'linearGradient', { id: 'gb', x1: 0, y1: 0, x2: 1, y2: 0 });
  el(g, 'stop', { offset: '0%', 'stop-color': '#3b82f6' }); el(g, 'stop', { offset: '100%', 'stop-color': '#a855f7' });
})();
</script>
</body>
</html>
