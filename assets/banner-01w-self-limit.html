<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>SignalDeck — Banner 01-W · Self Limit</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1500px; height: 750px; overflow: hidden; background: #09090b; }
body { position: relative; }
.band-top { position: absolute; top: 0; left: 0; right: 0; height: 125px; background: linear-gradient(to bottom, rgba(168,85,247,0.12) 0%, rgba(59,130,246,0.04) 55%, transparent 100%); }
.band-bottom { position: absolute; bottom: 0; left: 0; right: 0; height: 123px; background: linear-gradient(105deg, #3b82f6 0%, #6366f1 45%, #a855f7 100%); }
.stage { position: absolute; top: 125px; left: 0; width: 1500px; height: 500px; overflow: hidden; }
</style>
</head>
<body>

  <div class="band-top"></div>

  <div class="stage">
    <svg id="svg" width="1500" height="500" style="position:absolute;top:0;left:0;"></svg>

    <div style="position:absolute;inset:0;background:linear-gradient(to right,transparent 0%,transparent 52%,rgba(9,9,11,0.5) 68%,rgba(9,9,11,0.97) 84%);pointer-events:none;"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(to bottom,rgba(9,9,11,0.5) 0%,transparent 20%,transparent 80%,rgba(9,9,11,0.5) 100%);pointer-events:none;"></div>

    <div style="position:absolute;top:54px;right:68px;text-align:right;z-index:10;">
      <div style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:#3b82f6;letter-spacing:0.22em;text-transform:uppercase;margin-bottom:14px;">SignalDeck</div>
      <div style="font-size:70px;font-weight:900;letter-spacing:-0.038em;line-height:0.95;color:#fff;margin-bottom:14px;">
        Nobody Is<br>
        <span style="background:linear-gradient(95deg,#60a5fa 0%,#a855f7 100%);-webkit-background-clip:text;background-clip:text;color:transparent;">Watching.</span>
      </div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:13px;color:#52525b;letter-spacing:0.05em;margin-bottom:7px;">Own Capital &middot; No Prop Rule &middot; No Referee</div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#3f3f46;letter-spacing:0.04em;">Draw the line yourself &middot; Then hold it</div>
    </div>

    <div style="position:absolute;bottom:26px;right:68px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#27272a;letter-spacing:0.1em;z-index:10;">sgnldk.com</div>
    <div style="position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(to right,#3b82f6,#a855f7);"></div>
  </div>

<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('svg');

  function el(p, t, a) {
    const e = document.createElementNS(NS, t);
    for (const [k, v] of Object.entries(a)) e.setAttribute(k, v);
    p.appendChild(e); return e;
  }

  /* deterministic pseudo-random so the render is reproducible */
  let s = 20260807;
  function rnd() { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; }

  const defs = el(svg, 'defs', {});

  const gradLine = el(defs, 'linearGradient', { id: 'gradLine', x1: '0', y1: '0', x2: '1', y2: '0' });
  el(gradLine, 'stop', { offset: '0%',   'stop-color': '#3b82f6' });
  el(gradLine, 'stop', { offset: '62%',  'stop-color': '#60a5fa' });
  el(gradLine, 'stop', { offset: '100%', 'stop-color': '#a855f7' });

  const gradFill = el(defs, 'linearGradient', { id: 'gradFill', x1: '0', y1: '0', x2: '0', y2: '1' });
  el(gradFill, 'stop', { offset: '0%',   'stop-color': '#3b82f6', 'stop-opacity': '0.22' });
  el(gradFill, 'stop', { offset: '100%', 'stop-color': '#3b82f6', 'stop-opacity': '0' });

  const glow = el(defs, 'radialGradient', { id: 'glowPulse' });
  el(glow, 'stop', { offset: '0%',   'stop-color': '#2dd4bf', 'stop-opacity': '0.55' });
  el(glow, 'stop', { offset: '100%', 'stop-color': '#2dd4bf', 'stop-opacity': '0' });

  /* faint grid */
  for (let gy = 90; gy <= 430; gy += 68) {
    el(svg, 'line', { x1: 0, y1: gy, x2: 1500, y2: gy, stroke: '#18181b', 'stroke-width': 1 });
  }

  /* ---- equity curve: rises, gives a chunk back, recovers ---- */
  const N = 150, x0 = 60, x1 = 1075, baseY = 300;
  const pts = [];
  let v = 0;
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1);
    /* drift up, with a deliberate drawdown between t 0.42 and 0.62 */
    let drift = 1.5;
    if (t > 0.42 && t < 0.62) drift = -4.2;
    v += drift + (rnd() - 0.5) * 7.5;
    const x = x0 + t * (x1 - x0);
    const y = baseY - v;
    pts.push([x, y]);
  }

  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');

  /* area fill under the curve */
  el(svg, 'path', {
    d: d + ' L' + x1 + ' 470 L' + x0 + ' 470 Z',
    fill: 'url(#gradFill)'
  });

  /* ---- the self-drawn floor: hand-sketched dashed line the trader set ---- */
  const trough = pts.reduce((a, b) => (b[1] > a[1] ? b : a));
  const floorY = trough[1] + 34;

  /* slight waver so it reads as drawn by hand, not imposed by a system */
  const fseg = [];
  for (let i = 0; i <= 40; i++) {
    const fx = 40 + (i / 40) * (1115 - 40);
    const fy = floorY + Math.sin(i * 0.55) * 2.4 + (rnd() - 0.5) * 1.8;
    fseg.push((i ? 'L' : 'M') + fx.toFixed(1) + ' ' + fy.toFixed(1));
  }
  el(svg, 'path', {
    d: fseg.join(' '), fill: 'none', stroke: '#f59e0b',
    'stroke-width': 2.2, 'stroke-dasharray': '11 9', opacity: 0.72, 'stroke-linecap': 'round'
  });

  el(svg, 'text', {
    x: 46, y: floorY - 16,
    'font-family': 'JetBrains Mono, monospace', 'font-size': '15', 'font-weight': '700',
    fill: '#fbbf24', 'letter-spacing': '0.09em'
  }).textContent = 'MY LIMIT';
  el(svg, 'text', {
    x: 46, y: floorY + 26,
    'font-family': 'JetBrains Mono, monospace', 'font-size': '12',
    fill: '#71717a', 'letter-spacing': '0.05em'
  }).textContent = 'self-imposed / -8R';

  /* the drawdown gap: how close it actually came */
  el(svg, 'line', {
    x1: trough[0], y1: trough[1], x2: trough[0], y2: floorY,
    stroke: '#f43f5e', 'stroke-width': 1.5, 'stroke-dasharray': '3 5', opacity: 0.75
  });
  el(svg, 'circle', { cx: trough[0], cy: trough[1], r: 4.5, fill: '#f43f5e' });
  el(svg, 'text', {
    x: trough[0] + 14, y: trough[1] + 22,
    'font-family': 'JetBrains Mono, monospace', 'font-size': '12', 'font-weight': '700',
    fill: '#fb7185', 'letter-spacing': '0.04em'
  }).textContent = 'worst path';

  /* equity line on top */
  el(svg, 'path', {
    d: d, fill: 'none', stroke: 'url(#gradLine)',
    'stroke-width': 3, 'stroke-linejoin': 'round', 'stroke-linecap': 'round'
  });

  /* live pulse at the right end of the curve */
  const last = pts[pts.length - 1];
  el(svg, 'circle', { cx: last[0], cy: last[1], r: 22, fill: 'url(#glowPulse)' });
  el(svg, 'circle', { cx: last[0], cy: last[1], r: 5.5, fill: '#2dd4bf' });
})();
</script>
</body>
</html>
